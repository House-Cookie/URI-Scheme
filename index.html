<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abrir app por URI scheme</title>
<style>
  :root {
    --bg: #eef1f4;
    --panel: #ffffff;
    --ink: #1c2530;
    --muted: #5d6b7a;
    --line: #cfd6de;
    --accent: #1f5eff;
    --accent-ink: #ffffff;
    --err: #b3261e;
    --ok: #17803d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171d;
      --panel: #1b222b;
      --ink: #e8edf2;
      --muted: #93a1b0;
      --line: #2e3945;
      --accent: #5b8cff;
      --accent-ink: #0b1220;
      --err: #ff8a80;
      --ok: #5fd68a;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  main {
    width: 100%;
    max-width: 520px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 28px;
  }
  h1 { font-size: 1.35rem; margin: 0 0 6px; }
  p.sub { margin: 0 0 22px; color: var(--muted); font-size: .95rem; line-height: 1.5; }
  label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: 8px; }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
    font-family: ui-monospace, Consolas, monospace;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  input[type="text"]:focus-visible,
  a.open:focus-visible,
  .chip:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  #msg { min-height: 1.4em; margin: 10px 0 0; font-size: .88rem; color: var(--muted); }
  #msg.err { color: var(--err); }
  #msg.ok { color: var(--ok); }

  #result { margin-top: 18px; display: none; }
  #result.show { display: block; }
  a.open {
    display: block;
    text-align: center;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 700;
    font-size: 1.05rem;
    padding: 14px 18px;
    border-radius: 10px;
    text-decoration: none;
    word-break: break-all;
  }
  a.open:active { transform: translateY(1px); }
  #linkText {
    margin: 10px 0 0;
    font-family: ui-monospace, Consolas, monospace;
    font-size: .82rem;
    color: var(--muted);
    word-break: break-all;
  }

  .examples { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); }
  .examples h2 { font-size: .9rem; margin: 0 0 10px; color: var(--muted); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font: inherit;
    font-size: .85rem;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }
  small.note { display: block; margin-top: 18px; color: var(--muted); font-size: .8rem; line-height: 1.45; }
</style>
</head>
<body>
<main>
  <h1>Abrir una app con su URI scheme</h1>
  <p class="sub">Escribe el esquema de la app y aparecerá un botón para abrirla.</p>

  <label for="uri">URI scheme</label>
  <input type="text" id="uri" placeholder="whatsapp://send?phone=521234567890" autocomplete="off" autocapitalize="off" spellcheck="false">
  <p id="msg" role="status" aria-live="polite"></p>

  <div id="result">
    <a id="openLink" class="open" href="#" rel="noopener">Abrir aplicación</a>
    <p id="linkText"></p>
  </div>

  <section class="examples">
    <h2>Ejemplos para probar</h2>
    <div class="chips">
      <button type="button" class="chip" data-uri="whatsapp://send?text=Hola">whatsapp://</button>
      <button type="button" class="chip" data-uri="tg://resolve?domain=telegram">tg://</button>
      <button type="button" class="chip" data-uri="spotify:">spotify:</button>
      <button type="button" class="chip" data-uri="zoommtg://zoom.us/join">zoommtg://</button>
      <button type="button" class="chip" data-uri="vscode://file/">vscode://</button>
      <button type="button" class="chip" data-uri="mailto:ejemplo@correo.com">mailto:</button>
      <button type="button" class="chip" data-uri="tel:+521234567890">tel:</button>
      <button type="button" class="chip" data-uri="steam://open/main">steam://</button>
    </div>
  </section>

  <small class="note">
    La app debe estar instalada y registrada en tu dispositivo para ese esquema. Si no está, el navegador no hará nada o mostrará un aviso.
  </small>
</main>

<script>
(function () {
  var input = document.getElementById('uri');
  var result = document.getElementById('result');
  var link = document.getElementById('openLink');
  var linkText = document.getElementById('linkText');
  var msg = document.getElementById('msg');

  // Esquemas que nunca se permiten por seguridad
  var BLOCKED = ['javascript', 'data', 'vbscript', 'file', 'blob', 'about'];

  // Un scheme válido: letra seguida de letras, números, + . -  (RFC 3986)
  var SCHEME_RE = /^([a-zA-Z][a-zA-Z0-9+.\-]*):/;

  function setMsg(text, kind) {
    msg.textContent = text;
    msg.className = kind || '';
  }

  function hide() {
    result.classList.remove('show');
    link.setAttribute('href', '#');
  }

  function update() {
    var value = input.value.trim();

    if (!value) {
      hide();
      setMsg('');
      return;
    }

    var m = value.match(SCHEME_RE);
    if (!m) {
      hide();
      setMsg('Falta el esquema. Debe verse como nombre: o nombre://', 'err');
      return;
    }

    var scheme = m[1].toLowerCase();
    if (BLOCKED.indexOf(scheme) !== -1) {
      hide();
      setMsg('El esquema "' + scheme + '" está bloqueado por seguridad.', 'err');
      return;
    }

    link.setAttribute('href', value);
    link.textContent = 'Abrir aplicación (' + scheme + ')';
    linkText.textContent = value;
    result.classList.add('show');
    setMsg('Enlace listo. Pulsa el botón para abrir la app.', 'ok');
  }

  input.addEventListener('input', update);

  document.querySelectorAll('.chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      input.value = chip.getAttribute('data-uri');
      update();
      input.focus();
    });
  });
})();
</script>
</body>
</html>
